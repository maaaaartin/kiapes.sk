<!DOCTYPE html>
<!--<html xmlns="http://www.w3.org/1999/xhtml" xmlns:v="urn:schemas-microsoft-com:vml">-->
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta name="viewport" content="initial-scale=1.0, user-scalable=no"/>
<meta http-equiv="content-type" content="text/html; charset=UTF-8"/>
<title>Google Maps JavaScript API v3 Example: Geocoding Simple</title>
<link href="http://code.google.com/apis/maps/documentation/javascript/examples/default.css" rel="stylesheet" type="text/css" />
<script src="http://maps.google.com/maps/api/js?v=3.5&amp;sensor=false"></script>
<script type="text/javascript">
var geocoder;
var map;
var infowindow = new google.maps.InfoWindow({});

function initMap() {
	geocoder = new google.maps.Geocoder();
	var latlng = new google.maps.LatLng(48.693, 19.507);
	var myOptions = {
		zoom: 8,
		center: latlng,
		mapTypeId: google.maps.MapTypeId.ROADMAP
	}
	map = new google.maps.Map(document.getElementById("map_canvas"), myOptions);
}

function getAddress(marker,address,infowindow) {
var address = document.getElementById("address").value;
	geocoder.geocode( { 'address': address}, function(results, status) {
	  if (status == google.maps.GeocoderStatus.OK) {
		map.setCenter(results[0].geometry.location);
		var marker = new google.maps.Marker({
			map: map,
			draggable: true,
			position: results[0].geometry.location

		});
		getCoords(marker);
		//infowindow.open(map, marker);
		//getLatLng();
		} else {
			alert("Geocode was not successful for the following reason: " + status);
		}
	});
}
function updateAddress(address) {
  document.getElementById('address').value = address;
}
function getCoords(marker,address,infowindow){
	google.maps.event.addListener(marker, 'dragend', function(evt){
		lat = evt.latLng.lat().toFixed(3);
		lng = evt.latLng.lng().toFixed(3);
		latlng = lat + ',' + lng;
		infowindow = new google.maps.InfoWindow({
			content: '<b>Upravená pozícia</b></br>Latitude: ' + lat + '</br>Longitude: ' +lng
		});
		//infowindow.setContent(content);
		infowindow.open(map, marker);
		function getLatLng(){
			document.getElementById('lat').value = lat;
			document.getElementById('lng').value = lng;
		};
		getLatLng();
		console.log("marker dropped");
	});
	google.maps.event.addListener(marker, 'click', function(evt){
		lat = evt.latLng.lat().toFixed(3);
		lng = evt.latLng.lng().toFixed(3);
		latlng = lat + ',' + lng;
		infowindow = new google.maps.InfoWindow({
			content: '<b>Určená pozícia</b></br>Latitude: ' + lat + '</br>Longitude: ' +lng
		});
		//infowindow.setContent(content);
		infowindow.open(map, marker);
		function getLatLng(){
			document.getElementById('lat').value = lat;
			document.getElementById('lng').value = lng;
		};
		getLatLng();
	});
	google.maps.event.addListener(marker, 'dragstart', function() {
		updateAddress('Dragging...');
		console.log("marker is being dragged");
	});
	google.maps.event.addListener(marker, 'dragend', function() {
		updateAddress(address);
	});
}

google.maps.event.addDomListener(window, 'load', initMap);
</script>

<style type="text/css">
#inputs {
background-color: rgba(0,0,0,0.5);
position: absolute;
left: 100px;
bottom: 100px;
width: 400px;
z-index: 20000;
padding: 10px;
}
input, label {
margin: 5px 10px;
font-family: Sans-serif, Arial;
font-size: 100%;
}
#controls {
}
#position {
}
#position label {
color: rgba(255,255,255,1.0);
}
html, body, #map_canvas {
margin: 0;
width: 100%;
height: 100%;
font-family: Sans-serif, Arial;
font-size: 14px;
}
</style>
</head>
<body>
<div id="inputs">
<div id="controls">
<input id="address" type="textbox" value="Lovinobaňa, SK"><input type="button" value="Vyhľadať" onclick="getAddress();getCoords;">
</div>
<div id="position">
<input id="lat" type="textbox" value=""><label>Latitude</label></br><input id="lng" type="textbox" value=""><label>Latitude</label>
</div>
</div>
<div id="map_canvas"></div>
</body>
</html>
