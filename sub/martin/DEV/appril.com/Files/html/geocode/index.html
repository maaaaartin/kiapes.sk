		<script>
			//var appurl = 'http://dev.appril.com/appril/ApprilTools/Temp/StavbaGEO.aspx'
			var appurl = 'http://appril.com/ApprilTools/Temp/StavbaGEO.aspx'
			$(document).ready(function() {
				example();
				$('#run').bind('click', function() {
					example();
				});
			});
			function example() {
				var input = $('#input').val();
				var data = $.csv.toObjects(input);
				var html = generateTable(data);
				$('#result').empty();
				$('#result').html(html);
			}
			// build HTML table data from an array (one or two dimensional)
			function generateTable(data) {
				var html = '';
				if(typeof(data[0]) === 'undefined') {
				  return null;
				}
				if(data[0].constructor === Object) {
					for(var row in data) {
						html += '<tr><td><a href="' + appurl + '?';
						for(var item in data[row]) {
							html += item + '=' + data[row][item] + '&';
						}
						html = html.substring(0, html.length - 1);
						html += '">' + appurl + '?';
						for(var item in data[row]) {
							html += item + '=' + data[row][item] + '&';
						}
						html = html.substring(0, html.length - 1);
						html += '</a></td></tr>\r\n';
					}
				}
				return html;
			}
		</script>
	</head>
	<body>

			<h2>$.csv.toObjects()</h2>

			</div>
		</div>
