		function getMarkerImage(icon_color) {
			"use strict";
			if ((typeof(icon_color) === 'undefined') || (icon_color ===null)) { 
				icon_color = 'A'; 
			}
			if (!map_icons[icon_color]) {
				map_icons[icon_color] = new google.maps.MarkerImage('img/marker_'+ icon_color +'.png',
				new google.maps.Size(15.0, 23.0),
				new google.maps.Point(0.0, 0.0),
				new google.maps.Point(7.0, 11.0));
			} 
			return map_icons[icon_color];	
		}
		function state2color(state_val) {
			"use strict";
			var color = 'A';
			switch(state_val) {
				case 'B': color = 'B';
				break;
				case 'C': color = 'C';
				break;
				case 'D': color = 'D';
				break;
				case 'E': color ='E';
				break;
				case 'F': color = 'F';
				break;
				default: color = 'A';
				break;
			}
			return color;
		}
		map_icons["A"] = getMarkerImage(state2color('A'));
		map_icons["B"] = getMarkerImage(state2color('B'));
		map_icons["C"] = getMarkerImage(state2color('C'));
		map_icons["D"] = getMarkerImage(state2color('D'));
		map_icons["E"] = getMarkerImage(state2color('E'));
		map_icons["F"] = getMarkerImage(state2color('F'));
		function initialize() {
			"use strict"
			var latlng = new google.maps.LatLng(37.427770, -122.144841);
			var myOptions = {
				zoom: 10,
				center: latlng,
				mapTypeControl: true,
				mapTypeControlOptions: {
					style: google.maps.MapTypeControlStyle.DROPDOWN_MENU,
					position: google.maps.ControlPosition.TOP_RIGHT
				},
				panControlOptions: {
					position: google.maps.ControlPosition.TOP_LEFT
				},				
				zoomControlOptions: {
					position: google.maps.ControlPosition.TOP_LEFT
				},
				mapTypeId: google.maps.MapTypeId.ROADMAP
			};
			map = new google.maps.Map(document.getElementById('map_canvas'), myOptions);
			
			google.maps.event.addListener(map, 'click', function() {
				infowindow.close();
			});
			google.maps.event.addListener(infowindow, 'closeclick', function() {
				infowindow.close();
			});
			google.maps.event.addListener(map, 'bounds_changed', function() {
				google.maps.event.trigger(map, 'resize');
			});			
			//downloadUrl('dat/ba_data.xml', function(data) {
			downloadUrl('http://dev.nklc.sk/maaaaartin/html/appril.com/Files/html/maps/v02/dat/ba_data.xml', function(data) {
				//var xml = xmlParse(doc);
				var markers = data.documentElement.getElementsByTagName("item");
				for (var i = 0; i < markers.length; i++) {
					var lat = parseFloat(markers[i].getAttribute('lat'));
					var lng = parseFloat(markers[i].getAttribute('lng'));
					var latlng = new google.maps.LatLng(lat , lng);
					var name = markers[i].getAttribute('name');
					var text = markers[i].getAttribute('text');
					var street = markers[i].getAttribute('street');
					var zip = markers[i].getAttribute('zip');
					var city = markers[i].getAttribute('city');
					var district = markers[i].getAttribute('district');
					var county = markers[i].getAttribute('county');
					var country = markers[i].getAttribute('country');
					if (street) {
						var zip_txt = ',&nbsp;'+zip;
					} else {
						var zip_txt = zip;
					};
					if ((zip) || (street)) {
						var city_txt = '&nbsp;&nbsp;'+city;
					} else {
						var city_txt = city;
					};
					if (district) {
						var county_txt = ',&nbsp;'+county;
					} else {
						var county_txt = county;
					};
					var shortaddress = street+zip_txt+city_txt;
					var fulladdress = street+zip_txt+city_txt+'</br>'+district+county_txt;
					var category_id = markers[i].getAttribute('category_id');	
					var category = markers[i].getAttribute('category');	
					var type = markers[i].getAttribute('type');
					var type_id = markers[i].getAttribute('type_id');
					var form = markers[i].getAttribute('form');
					var form_id = markers[i].getAttribute('form_id');
					var state = markers[i].getAttribute('state');
					var state_id = markers[i].getAttribute('state_id');
					var invest = markers[i].getAttribute('invest');
					if (invest) {
						var invest_txt = +invest+'&nbsp;€';
					} else {
						var invest_txt = '-';
					};
					var date_first = markers[i].getAttribute('date_first');
					var date_last = markers[i].getAttribute('date_last');
					var thumb_img = markers[i].getAttribute('thumb_img');
					var link = markers[i].getAttribute('link');
					if (state_id == '19') {
						var state_val = 'A';
						var state_name = 'Zámer';
					};
					if (state_id == '2') {
						var state_val = 'B';
						var state_name = 'V príprave';
					};
					if (state_id == '9') {
						var state_val = 'C';
						var state_name = 'Vo výstavbe';
					};
					if (state_id == '11') {
						var state_val = 'D';
						var state_name = 'Zrušené';
					};
					if (state_id == '13') {
						var state_val = 'E';
						var state_name = 'Pozastavené';
					};
					if (state_id == '14') {
						var state_val = 'F';
						var state_name = 'Realizované';
					}					
					var marker = createMarker(latlng,name,text,city,shortaddress,fulladdress,category_id,category,type_id,type,form_id,form,state_id,state,state_val,state_name,invest,invest_txt,date_first,date_last,thumb_img,link);
				}
				showItem('A');
				showItem('B');
				showItem('C');
				hideItem('D');
				hideItem('E');
				hideItem('F');
				makeList();
			});
		}
		function createMarker(latlng,name,text,city,shortaddress,fulladdress,category_id,category,type_id,type,form_id,form,state_id,state,state_val,state_name,invest,invest_txt,date_first,date_last,thumb_img,link) {
			"use strict"
			var linkid = 'link'+(markers.length);
			var listid = linkid;
			var scrolltoid = '#'+(linkid);
			var content = '<div class="infowin_frame state_'+state_val+'">'+
							'<div class="map_item_img"></div>'+
							'<div class="infowin_detail">'+
								'<div class="infowin_title bold">'+name+'</div></br>'+
								'<span class="autospan">'+fulladdress+'</span></br>'+
								'<table>'+
									'<tr><td><span class="fixedspan">Kategória:&nbsp;</span></td><td>'+category+'</td></tr>'+
									'<tr><td><span class="fixedspan">Trieda:&nbsp;</span></td><td>'+form+'</td></tr>'+
									'<tr><td><span class="fixedspan">Stav:&nbsp;</span></td><td>'+state_name+'</td></tr>'+
									'<tr><td><span class="fixedspan">Objem investície:&nbsp;</span></td><td>'+invest_txt+'</td></tr>'+
								'</table>'+
							'</div>'+
							'<div class="clear">'+
							'</div>'+
							'<div class="infowin_description">'+text+
							'</div>'+
							'<div class="map_item_date bold txt_'+state_val+'">'+date_last+
							'<a href="'+link+'" target="_blank" class="map_item_link">Zobraziť detail stavby</a></div>'+
						'</div>';
			var marker = new google.maps.Marker({
				position: latlng,
				icon: map_icons[state_val],
				shadow: icon_shadow,
				map: map,
				animation: google.maps.Animation.DROP,
				title: name,
				zIndex: Math.round(latlng.lat()*-100000)<<5
			});		
			marker.mycategory = category;                                 
			marker.myname = name;
			marker.mytext = text;
			marker.mystate_val = state_val;
			marker.mystate_name = state_name;
			marker.mycity = city;
			marker.mydate_last = date_last;
			marker.mylinkid  =  linkid;
			markers.push(marker);
			google.maps.event.addListener(infowindow, 'closeclick', function() {
				if (linkid_last) {
					document.getElementById(linkid_last).className = document.getElementById(linkid_last).className.replace( /(?:^|\s)active(?!\S)/ , '' );
					linkid_last = marker.mylinkid;
				}
				jQuery('#'+linkid_last).removeClass('active');
			});
			google.maps.event.addListener(marker, 'click', function() {
				//jQuery('#'+marker.mylinkid).removeClass('active');
				linkid = marker.mylinkid;
				if (linkid_last) {
					document.getElementById(linkid).className = document.getElementById(linkid).className.replace( /(?:^|\s)active(?!\S)/ , '' );
				}
				if (linkid) {
					document.getElementById(listid).className.replace( /(?:^|\s)active(?!\S)/ , '' )
				}
				infowindow.setContent(content);
				/* Trunk8 */
				infowindow.open(map,marker);
				jQuery('#map_list_scroll').scrollTo(scrolltoid);
				jQuery('.infowin_frame').parents().eq(1).css('height', '370px !important');
				jQuery('.infowin_frame').parents().eq(1).css('overflow', 'visible');
				jQuery('.infowin_frame').parents().eq(0).css('height', '370px !important');
				jQuery('.infowin_frame').parents().eq(0).css('overflow', 'visible');
				//jQuery('#'+linkid_last).addClass('active');
				document.getElementById(linkid).className += ' active';
				linkid_last = linkid;
			});
			google.maps.event.addListener(infowindow, 'domready', function() {
				/* Trunk8 */
				jQuery('.infowin_description').trunk8({
					lines: 4
				});
			});
		}
		function myClick(i) {
			"use strict"
			google.maps.event.trigger(markers[i],'click');
		}
	//]]>
