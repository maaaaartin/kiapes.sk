  var map = new google.maps.Map(document.getElementById('map_object'), mapOptions);

  var contentString = '<div style="height: 350px; width: 500px; display: block; overflow: hidden;"><img src="http://www.appril.com/getattachment/d580ae1a-7d70-48a6-8125-f65a27349907/Bytovy-dom-KARPATIA,-BA-Dubravka.aspx?maxSideSize=570&width=420&height=570" alt="" style="height: 100%; width: auto; display: block;"><\/div>';

  var infowindow = new google.maps.InfoWindow({
      content: contentString
  });

  var marker = new google.maps.Marker({
      position: myLatlng,
      map: map,
      //title: 'Uluru (Ayers Rock)'
  });
  google.maps.event.addListener(marker, 'click', function() {
    infowindow.open(map,marker);
  });
  google.maps.event.addListenerOnce(map, 'idle', function() {
    infowindow.open(map,marker);
  });
google.maps.event.addListener(map, 'click', function () {
	infowindow.close();
});

  }

google.maps.event.addDomListener(window, 'load', initialize);
