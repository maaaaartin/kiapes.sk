<!DOCTYPE html>
<html>
	<head>
		<script src="http://www.appril.com/CMSScripts/jquery/jquery-core.js" type="text/javascript"></script>
		<meta charset="utf-8">
		<title>Street View service</title>
		<style>
			html, body, #map-canvas {
			height: 100%;
			margin: 0px;
			padding: 0px
			}
		</style>
		<script src="https://maps.googleapis.com/maps/api/js?v=3.exp&sensor=false"></script>
		<script>
			function initialize() {
			var lat= jQuery( "#lat" ).html();
			var lng= jQuery( "#lng" ).html();
			var latlng = new google.maps.LatLng(lat,lng);
			var mapOptions = {
				center: latlng,
				zoom: 14
			};
			var map = new google.maps.Map(document.getElementById('map_canvas'), mapOptions);
			var streetOptions = {
				position: latlng,
				pov: {
					heading: 45,
					pitch: 10
				}
			};
			var street = new  google.maps.StreetViewPanorama(document.getElementById('map_street'),streetOptions);
			map.setStreetView(street);
			}
			google.maps.event.addDomListener(window, 'load', initialize);
		</script>
	</head>
	<body>
		<div id="map_canvas" style="width: 400px; height: 300px"><span id="lat">49.1363</span><span id="lng">19.5116</span></div>
		<div id="map_street" style="width: 400px; height: 300px"></div>
	</body>
</html>
