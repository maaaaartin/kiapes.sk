<html xmlns="http://www.w3.org/1999/xhtml" xmlns:v="urn:schemas-microsoft-com:vml">
	<head>
	<meta http-equiv="content-type" content="text/html; charset=utf-8"/>
	<title>Google Maps JavaScript API Example: Street View Data Example</title>
	<script type="text/javascript" src="http://maps.google.com/maps?file=api&amp;&v=2&key=ABQIAAAAjU0EJWnWPMv7oQ-jjS7dYxSPW5CJgpdgO_s4yyMovOaVh_KvvhSfpvagV18eOyDWu7VytS6Bi1CWxw"></script>
	<script src="http://www.appril.com/CMSScripts/jquery/jquery-core.js" type="text/javascript"></script>
    <script type="text/javascript"> 
		var map;
		var street;   
		var streetClient;
		var houseMarker;

		function initialize() {
			var lat= jQuery( "#lat" ).html();
			var lng= jQuery( "#lng" ).html();
			//var lat= "40.7141667";
			//var lng= "-74.0063889";
			streetClient = new GStreetviewClient();      
			map = new GMap2(document.getElementById("map_canvas"));
			map.setCenter(new GLatLng(lat,lng), 15);
			map.addControl(new GSmallMapControl());
			map.addControl(new GMapTypeControl());

			houseMarker = new GMarker(new GLatLng(lat,lng), {draggable: true});
			map.addOverlay(houseMarker); 
			//houseMarker.openInfoWindowHtml("Drag me to angle the panorama.");
			GEvent.addListener(houseMarker, "dragend", function() {
				streetClient.getNearestPanorama(houseMarker.getLatLng(), showstreetData);
			});

			street = new GStreetviewPanorama(document.getElementById("map_street"));
			streetClient.getNearestPanorama(houseMarker.getLatLng(), showstreetData);
		}
		function showstreetData(streetData) {
			if (streetData.code != 200) {
				GLog.write('showstreetData: Server rejected with code: ' + streetData.code);
				return;
			}
			var angle = computeAngle(houseMarker.getLatLng(), streetData.location.latlng);
			street.setLocationAndPOV(streetData.location.latlng, {yaw: angle});
		}
		function computeAngle(endLatLng, startLatLng, lat, lng) {
			var DEGREE_PER_RADIAN = lat;
			var RADIAN_PER_DEGREE = lng;
			var dlat = endLatLng.lat() - startLatLng.lat();
			var dlng = endLatLng.lng() - startLatLng.lng();
			// We multiply dlng with cos(endLat), since the two points are very closeby,
			// so we assume their cos values are approximately equal.
			var yaw = Math.atan2(dlng * Math.cos(endLatLng.lat() * RADIAN_PER_DEGREE), dlat)
				 * DEGREE_PER_RADIAN;
			return wrapAngle(yaw);
		}
		function wrapAngle(angle) {
			if (angle >= 360) {
				angle -= 360;
			} else if (angle < 0) {
				angle += 360;
			}
			return angle;
		};
    </script>
  </head>
  <body onload="initialize()" onunload="GUnload()">
    <div id="map_canvas" style="width: 500px; height: 400px"><span id="lat">49.1363</span><span id="lng">19.5116</span></div>
    <div name="map_street" id="map_street" style="width: 500px; height: 300px"></div>
  </body>
</html>
